{% extends "_base.html" %}

{% load crispy_forms_tags %}

{% block content %}
<div class="col-8 mx-3">
    <div class="container mt-5 p-4 shadow-lg">
        <form action="" method="post">
            {% csrf_token %}
            <table>
                {{ form|crispy }}
            </table>
            <a class="btn btn-outline-warning m-4" href="{% url 'password_reset' %}">فراموشی رمز عبور</a>
            <input class="btn btn-outline-success m-4" type="submit" value="ورود">
        </form>
    </div>
</div>
<script>
    const form = document.getElementById("loginForm");

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const response = await fetch(
        "http://127.0.0.1:8000/api/auth/login/",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            })
        }
    );

    const data = await response.json();

    if (response.ok) {
        console.log("ورود موفق:", data);
    } else {
        console.log("خطا:", data);
    }
});
</script>
{% endblock content %}
